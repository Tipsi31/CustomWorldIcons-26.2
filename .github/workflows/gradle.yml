name: Build Custom World Icons

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: CustomWorldIcons-26.2-project
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomWorldIcons-26.2
          path: CustomWorldIcons-26.2-project/build/libs/*.jar
